<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>4ruple.ai</title>
  <meta name="theme-color" content="#F6F5F2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <aside class="sidebar" aria-label="Workspace navigation">
    <a class="lockup" href="#leads" aria-label="4ruple.ai by Basement Protocol, go to leads">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 44V4H44V11H11V44H4Z"/><path d="M15 44V15H44V22H22V44H15Z"/><path d="M26 44V26H44V33H33V44H26Z"/><path class="mark-dot" d="M37 37H44V44H37Z"/></svg>
      <span class="lockup-text"><span class="wordmark">4ruple.ai</span><span class="endorse">by Basement Protocol</span></span>
    </a>

    <div class="workspace">
      <span class="workspace-avatar" id="workspace-initial">4</span>
      <span class="workspace-text"><strong id="workspace-name">Your workspace</strong><span>Sales workspace</span></span>
    </div>

    <nav id="tabs" aria-label="Main navigation">
      <p class="nav-group">Pipeline</p>
      <button data-tab="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M21 20a6 6 0 0 0-4-5.6"/></svg><span>Leads</span><i class="count" data-count="leads"></i></button>
      <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 15l2 2 4-4"/></svg><span>Review</span><i class="count" data-count="review"></i></button>
      <button data-tab="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-7.5 18-3.5-7.5L3 10Z"/><path d="M21 3 10 13.5"/></svg><span>Outreach</span><i class="count" data-count="send"></i></button>
      <p class="nav-group">Workspace</p>
      <button data-tab="team" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2h12v2"/></svg><span>Team</span></button>
      <button data-tab="you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M10 21v-4h4v4"/></svg><span>Your firm</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
    </nav>

    <div class="sidebar-foot">
      <div id="setup"></div>
      <a class="send-mode" id="send-mode" href="#send"><i></i>Preview mode</a>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="crumbs"><span>Workspace</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span id="route-name">Leads</span></div>
      <div class="topbar-right"><p class="tally" id="tally" aria-label="Pipeline at a glance"></p><a class="mode-chip" id="send-mode-top" href="#send">Preview mode</a></div>
    </header>
    <main id="view" tabindex="-1"><p class="loading">Loading your workspace</p></main>
  </div>

  <section id="license-gate" aria-labelledby="license-title" hidden></section>
  <dialog id="contact-drawer" aria-labelledby="contact-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
